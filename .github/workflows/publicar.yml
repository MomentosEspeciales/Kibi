name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas con datos ficticios
        run: npm test
      # Revisa la agenda real antes de publicarla: los errores paran la publicación, las dudas salen como avisos.
      - name: Revisar los datos de la agenda
        env:
          CODIGO_FAMILIAR: ${{ secrets.CODIGO_FAMILIAR }}
        run: |
          if [ -n "$CODIGO_FAMILIAR" ]; then node scripts/validar.mjs --cifrado; else echo "Sin CODIGO_FAMILIAR: no se revisan los datos reales."; fi
      - name: Preparar solo los archivos de la app
        run: |
          mkdir _site
          cp index.html styles.css config.js logica.js agenda.js cripto.js sw.js manifest.webmanifest datos.cifrados.json icon.svg icon-180.png icon-192.png icon-512.png badge.png _site/
      # La caché sin conexión cambia de nombre cuando cambia cualquier archivo publicado: así los móviles no se quedan con una versión vieja.
      - name: Versionar la caché del service worker
        run: |
          VERSION=$(cd _site && cat $(ls | grep -v '^sw.js$' | sort) | sha256sum | cut -c1-12)
          sed -i -E "s/const CACHE = \"kibi-[^\"]*\";/const CACHE = \"kibi-$VERSION\";/" _site/sw.js
          grep -q "kibi-$VERSION" _site/sw.js
      - name: Comprobar estilos publicados
        run: |
          test -s _site/styles.css
          test -s _site/agenda.js
          test -s _site/index.html
          grep -Eq 'href="styles[.]css([?][^"]*)?"' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
