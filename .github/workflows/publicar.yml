name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar anotaciones con datos sintéticos
        run: npm run test:agenda
      - name: Preparar solo los archivos de la app
        run: |
          mkdir _site
          cp index.html styles.css config.js logica.js agenda.js cripto.js sw.js manifest.webmanifest datos.cifrados.json icon.svg icon-180.png icon-192.png icon-512.png badge.png _site/
      - name: Comprobar estilos publicados
        run: |
          test -s _site/styles.css
          test -s _site/agenda.js
          test -s _site/index.html
          grep -Eq 'href="styles[.]css([?][^"]*)?"' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
